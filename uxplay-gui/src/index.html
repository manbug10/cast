<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UxPlay GUI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
        }
        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        #startBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        #stopBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            display: none;
        }
        #stopBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            margin-top: 25px;
            padding: 15px 20px;
            border-radius: 6px;
            background-color: #f8f9fa;
            font-weight: 600;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        #log {
            margin-top: 20px;
            padding: 20px;
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Consolas', 'Monaco', monospace;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
        }
        .running {
            background-color: #d4edda !important;
            color: #155724;
            border-left-color: #28a745 !important;
        }
        .error {
            background-color: #f8d7da !important;
            color: #721c24;
            border-left-color: #dc3545 !important;
        }
        .info-box {
            background: #e7f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #004085;
        }
        .info-box strong {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 UxPlay GUI</h1>
        
        <div class="info-box">
            <strong>ℹ️ Note:</strong> Make sure UxPlay is installed and available in your system PATH before starting.
        </div>
        
        <div class="form-group">
            <label for="deviceName">Device Name (how it will appear on iOS/macOS):</label>
            <input type="text" id="deviceName" value="UxPlay" placeholder="Enter device name">
        </div>

        <div class="form-group">
            <label for="port">Port (optional, leave empty for default):</label>
            <input type="number" id="port" placeholder="Default: 5000" min="1024" max="65535">
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="verbose">
            <label for="verbose">Verbose mode (detailed logging)</label>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="noVideo" checked>
            <label for="noVideo">Audio only mode (disable video)</label>
        </div>

        <div class="form-group checkbox-group">
            <input type="checkbox" id="fs">
            <label for="fs">Fullscreen mode</label>
        </div>

        <div class="button-group">
            <button id="startBtn" onclick="startUxPlay()">▶ Start UxPlay</button>
            <button id="stopBtn" onclick="stopUxPlay()">⏹ Stop UxPlay</button>
        </div>

        <div id="status">Status: Ready to start</div>
        <div id="log">Logs will appear here...</div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.core;
        const { listen } = window.__TAURI__.event;

        let isRunning = false;

        async function startUxPlay() {
            const deviceName = document.getElementById('deviceName').value.trim();
            if (!deviceName) {
                alert('Please enter a device name');
                return;
            }

            const port = document.getElementById('port').value;
            const verbose = document.getElementById('verbose').checked;
            const noVideo = document.getElementById('noVideo').checked;
            const fs = document.getElementById('fs').checked;

            try {
                document.getElementById('status').textContent = 'Status: Starting...';
                document.getElementById('status').className = '';
                
                await invoke('start_uxplay', { 
                    deviceName, 
                    port: port ? parseInt(port) : null,
                    verbose,
                    noVideo,
                    fs
                });

                isRunning = true;
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'block';
                document.getElementById('status').textContent = 'Status: Running - Waiting for AirPlay connection';
                document.getElementById('status').className = 'running';
                appendLog('UxPlay started successfully');
            } catch (error) {
                document.getElementById('status').textContent = 'Status: Error - ' + error;
                document.getElementById('status').className = 'error';
                appendLog('Error: ' + error);
            }
        }

        async function stopUxPlay() {
            try {
                await invoke('stop_uxplay');
                isRunning = false;
                document.getElementById('startBtn').style.display = 'block';
                document.getElementById('stopBtn').style.display = 'none';
                document.getElementById('status').textContent = 'Status: Stopped';
                document.getElementById('status').className = '';
                appendLog('UxPlay stopped');
            } catch (error) {
                document.getElementById('status').textContent = 'Status: Error stopping - ' + error;
                document.getElementById('status').className = 'error';
                appendLog('Error stopping: ' + error);
            }
        }

        function appendLog(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.textContent += `[${timestamp}] ${message}\n`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Listen for log events from Rust backend
        listen('uxplay-log', (event) => {
            appendLog(event.payload);
        });

        listen('uxplay-status', (event) => {
            document.getElementById('status').textContent = 'Status: ' + event.payload;
            if (event.payload === 'Running') {
                document.getElementById('status').className = 'running';
            } else {
                document.getElementById('status').className = '';
            }
        });

        // Check initial status
        async function checkStatus() {
            try {
                const status = await invoke('get_status');
                if (status === 'Running') {
                    isRunning = true;
                    document.getElementById('startBtn').style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'block';
                    document.getElementById('status').textContent = 'Status: Running';
                    document.getElementById('status').className = 'running';
                }
            } catch (error) {
                console.error('Failed to check status:', error);
            }
        }

        checkStatus();
    </script>
</body>
</html>
