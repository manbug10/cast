[package]
name = "uxplay-gui"
version = "1.0.0"
description = "Interfaz gráfica para UxPlay con motor integrado"
authors = ["Tu Nombre"]
license = "MIT"
repository = "https://github.com/tu-usuario/uxplay-gui"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
